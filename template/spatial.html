<template>
  <div id="spatial">
    <h1 class="headline">
      CS1.6 Map Creation
    </h1>

    <div class="loading"><span></span></div>

    <div id="{{ id }}Work"></div>

  </div>
</template>

<script>
  async function spatialWork(id) {
    zk.getId("spatial").dataBind({ id });
    const workEl = zk.getId(`${id}Work`);
    workEl.addClass("d-none");
    workEl.html = "";
    const slotContentEl = zk.one("[slot=content]");
    const bodyEl = zk.getTag("body")[0];

    try {
      const res = await fetch(API_GET_DATA);
      const data = await res.json();
      const filteredData = data.filter(
        (spatial) => id.toLowerCase() === spatial.category.toLowerCase()
      );
      for (let spatial of filteredData) {
        let divEl = zk.makeTag("div");
        divEl.className = "spatial_Thumbnail";
        let imgEl = zk.makeTag("img");
        imgEl.decoding = "async";
        imgEl.src = `/SpatialFantasy/img/spatial/${id}/` + spatial.gallery[0];
        let spanEl = zk.makeTag("span");
        spanEl.html = spatial.title;
        divEl.addKid(imgEl);
        divEl.addKid(spanEl)
        divEl.setAttr("path", `${spatial.category}/${spatial.title}`);

        // 點擊作品列表，將會自動載入相對應作品詳細頁面。
        divEl.on('click', event => {

            if(location.hash.includes("#")) {
              location.hash = `/${zk.toZekiEl(event.srcElement.parentElement).getAttr('path')}`;
            } else {
              history.pushState(null, "", `./${zk.toZekiEl(event.srcElement.parentElement).getAttr('path')}`);
            }
            zk.one('[slot=content]').setAttr('path', zk.toZekiEl(event.srcElement.parentElement).getAttr('path'));

        })
        workEl.addKid(divEl);
      }
    } catch (error) {
      console.error("資料載入失敗", error);
    }

    /* 在CSS裡，因justify-content使用space-evenly空間平均分配，
    所以最後剩餘的元素因為數量不足又加上自動分配空間的關係，
    所以乍看之下像是跑版， 因此製造空白的元素來做填充防止跑版。 */
    for (let i = 0; i < 4; i++) {
      let dummyEl = zk.makeTag("div");
      dummyEl.className = "filling-empty-space-childs";
      workEl.addKid(dummyEl);
    }

    // 延遲函式
    // function sleep(ms) {
    //     return new Promise(resolve => setTimeout(resolve, ms));
    //   }
    // await sleep(5000);
    let images = workEl.getTag("img");
    const promises = images.map((image) => {
      return new Promise((resolve, reject) => {
        image.onload = () => resolve(image);
        image.onerror = () => reject(image);
      });
    });

    // 利用Promise.all監聽所有圖片加載完成
    Promise.allSettled(promises).then((results) => {
      results.map((result) => {
        // 如果圖片載入錯誤，則刪除該元素節點不顯示出來!
        if (result.status === "rejected") {
          workEl.delKid(result.reason.parentNode);
          console.debug(`The ${result.reason.src} url is Error!`);
        }
      });
      // 圖片載入完成時，關閉loading動畫，顯示所有圖片。
      zk.getClass("loading")[0].addClass("d-none");
      workEl.delClass("d-none");

    });

  }

  switch (location.href.split("/").pop()) {
    // case "de":
    //   spatialWork("de");
    //   break;
    // case "cs":
    //   spatialWork("cs");
    //   break;
    // case "as":
    //   spatialWork("as");
    //   break;
    default:
      spatialWork("csmap");
  }
</script>
